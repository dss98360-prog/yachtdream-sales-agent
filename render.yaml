services:
  - type: web
    name: yachtdream-sales-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////app/data/yachtdream.db
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: yachtdream-sales-agent.onrender.com,localhost,127.0.0.1

